services:

  # Base de datos del microservicio Lugar
  postgres-lugar:
    image: postgres:16-alpine
    container_name: ticketya-postgres-lugar
    environment:
      POSTGRES_DB: ticketya_lugares
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_lugar_data:/var/lib/postgresql/data

  # Base de datos del microservicio Ticket
  postgres-ticket:
    image: postgres:16-alpine
    container_name: ticketya-postgres-ticket
    environment:
      POSTGRES_DB: ticketya_tickets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_ticket_data:/var/lib/postgresql/data

  # Cliente y Evento pasan a PostgreSQL sin afectar las bases existentes.
  postgres-cliente:
    image: postgres:16-alpine
    container_name: ticketya-postgres-cliente
    environment:
      POSTGRES_DB: ticketya_clientes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - postgres_cliente_data:/var/lib/postgresql/data

  postgres-evento:
    image: postgres:16-alpine
    container_name: ticketya-postgres-evento
    environment:
      POSTGRES_DB: ticketya_eventos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5435:5432"
    volumes:
      - postgres_evento_data:/var/lib/postgresql/data

  # Reservas temporales
  redis:
    image: redis:7-alpine
    container_name: ticketya-redis
    ports:
      - "6379:6379"

volumes:
  postgres_lugar_data:
  postgres_ticket_data:
  postgres_cliente_data:
  postgres_evento_data:
