server.port=8081
spring.application.name=microservicio-cliente

spring.datasource.url=jdbc:postgresql://localhost:5434/ticketya_clientes
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

logging.level.org.springframework.web=INFO
logging.level.com.ticketya=DEBUG
spring.devtools.restart.enabled=true

# Las preferencias se guardan en MongoDB (Cliente y Notificacion siguen en PostgreSQL)
spring.data.mongodb.uri=${TICKETYA_MONGO_URI:mongodb://localhost:27017/ticketya_preferencias}

# Punto 11: SMTP local con Mailpit; configurable para un SMTP externo
spring.mail.host=${TICKETYA_SMTP_HOST:localhost}
spring.mail.port=${TICKETYA_SMTP_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
ticketya.notificaciones.email.habilitado=${TICKETYA_EMAIL_HABILITADO:true}
ticketya.notificaciones.email.desde=${TICKETYA_EMAIL_DESDE:notificaciones@ticketya.local}
ticketya.notificaciones.intervalo-ms=10000

# URLs internas para las recomendaciones del punto 10
microservices.eventos.url=${TICKETYA_EVENTO_URL:http://localhost:8082}
microservices.lugar.url=${TICKETYA_LUGAR_URL:http://localhost:8083}

# Integracion 04 - JWT firmado y clave entre servicios (defaults solo para desarrollo)
ticketya.jwt.secret=${TICKETYA_JWT_SECRET:ticketya-dev-only-change-this-jwt-secret-2026}
ticketya.internal.key=${TICKETYA_INTERNAL_KEY:ticketya-dev-only-change-this-internal-key-2026}

# Cuentas privilegiadas: deben configurarse con variables de entorno
# Los clientes ingresan con el ID y la contraseña registrada en PostgreSQL
ticketya.auth.admin.id=${TICKETYA_ADMIN_ID:}
ticketya.auth.admin.password=${TICKETYA_ADMIN_PASSWORD:}
ticketya.auth.organizador.id=${TICKETYA_ORGANIZADOR_ID:}
ticketya.auth.organizador.password=${TICKETYA_ORGANIZADOR_PASSWORD:}
ticketya.auth.acceso.id=${TICKETYA_ACCESO_ID:}
ticketya.auth.acceso.password=${TICKETYA_ACCESO_PASSWORD:}

# Incluir el traceId en los mensajes de log
logging.pattern.level=%5p [trace=%X{traceId:-}]
