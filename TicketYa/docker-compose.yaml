version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongo-ticketya
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgresql:
    image: postgres:16
    container_name: postgres-ticketya
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=ticketya_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis-ticketya
    ports:
      - "6379:6379"

volumes:
  mongo_data:
  postgres_data:
