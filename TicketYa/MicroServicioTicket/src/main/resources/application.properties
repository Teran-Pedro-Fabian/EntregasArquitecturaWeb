
server.port=8084


spring.application.name=microservicio-ticket


spring.datasource.url=jdbc:postgresql://localhost:5433/ticketya_tickets
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.web=INFO
logging.level.com.ticketya=DEBUG

spring.devtools.restart.enabled=true

# Configuracion de la pasarela de pagos simulada
ticketya.pagos.mock.reintegro-aprobado=true
