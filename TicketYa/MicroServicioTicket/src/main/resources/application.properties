
server.port=8084


spring.application.name=microservicio-ticket


spring.datasource.url=jdbc:postgresql://localhost:5433/ticketya_tickets
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.web=INFO
logging.level.com.ticketya=DEBUG

spring.devtools.restart.enabled=true

# Configuracion de la pasarela de pagos simulada
ticketya.pagos.mock.reintegro-aprobado=true

# Punto 4: entradas maximas por cliente y evento
ticketya.compra.max-entradas=4
# Medio de pago simulado
ticketya.pagos.mock.pago-aprobado=true

# Punto 11: avisar compras confirmadas sin afectar el pago
ticketya.notificaciones.intervalo-ms=10000

# Fila virtual de eventos de alta demanda
spring.data.redis.host=${TICKETYA_REDIS_HOST:localhost}
spring.data.redis.port=${TICKETYA_REDIS_PORT:6379}
ticketya.cola.tanda-size=10
ticketya.cola.ttl-minutos=60

# Integracion 04 - JWT firmado y clave entre servicios (defaults solo para desarrollo)
ticketya.jwt.secret=${TICKETYA_JWT_SECRET:ticketya-dev-only-change-this-jwt-secret-2026}
ticketya.internal.key=${TICKETYA_INTERNAL_KEY:ticketya-dev-only-change-this-internal-key-2026}
