openapi: 3.0.3
info:
  title: TicketYa - MicroServicioTicket
  version: 2.0.0
  description: Compras, fila virtual, pagos mock, QR, devoluciones, reportes, reintegros y seguridad JWT
servers:
- url: http://localhost:8080
  description: API Gateway - entrada externa recomendada
- url: http://localhost:8084
  description: Microservicio directo - desarrollo local
tags:
- name: Ticket
  description: Operaciones del microservicio Ticket
- name: Interno
  description: Comunicacion HTTP entre microservicios; no destinada al usuario final
- name: Fila virtual
  description: Control de acceso a compras de alta demanda
- name: Acceso
  description: Validacion de entradas mediante QR
- name: Reportes
  description: Reportes para organizadores
paths:
  /ticket/comprar:
    post:
      tags:
      - Ticket
      summary: Comprar entradas numeradas
      description: Requiere reserva previa, si falta confirmar en Lugar responde 202 con estado PENDIENTE_CONFIRMACION, no
        se cobra de nuevo en reintentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompraNumeradaRequest'
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
        '400':
          description: Datos invalidos o solicitud incorrecta
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '409':
          description: Operacion rechazada por el estado o por conflicto
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '502':
          description: Error de comunicacion con otro microservicio
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '503':
          description: Microservicio dependiente no disponible
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '202':
          description: Pago aprobado pero falta confirmar la venta en Lugar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - CLIENTE
      - ADMINISTRADOR
  /ticket/emitir:
    post:
      tags:
      - Ticket
      summary: Comprar entradas numeradas (ruta alternativa)
      description: Requiere reserva previa si falta confirmar en Lugar responde 202 con estado PENDIENTE_CONFIRMACION, no
        se cobra de nuevo en reintentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompraNumeradaRequest'
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
        '400':
          description: Datos invalidos o solicitud incorrecta
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '409':
          description: Operacion rechazada por el estado o por conflicto
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '502':
          description: Error de comunicacion con otro microservicio
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '503':
          description: Microservicio dependiente no disponible
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '202':
          description: Pago aprobado pero falta confirmar la venta en Lugar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - CLIENTE
      - ADMINISTRADOR
  /ticket/comprar-general:
    post:
      tags:
      - Ticket
      summary: Comprar entradas generales
      description: Requiere reserva previa, si falta confirmar en Lugar responde 202 con estado PENDIENTE_CONFIRMACION, no
        se cobra de nuevo en reintentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompraGeneralRequest'
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
        '400':
          description: Datos invalidos o solicitud incorrecta
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '409':
          description: Operacion rechazada por el estado o por conflicto
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '502':
          description: Error de comunicacion con otro microservicio
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '503':
          description: Microservicio dependiente no disponible
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '202':
          description: Pago aprobado pero falta confirmar la venta en Lugar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - CLIENTE
      - ADMINISTRADOR
  /ticket/clientes/{idCliente}:
    get:
      tags:
      - Ticket
      summary: Consultar entradas del cliente
      description: Devuelve las entradas del cliente autenticado ordenadas desde la mas nueva
      parameters:
      - name: idCliente
        in: path
        required: true
        schema:
          type: string
        example: cliente-01
      responses:
        '200':
          description: Operacion correcta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - CLIENTE
      - ADMINISTRADOR
  /ticket/compras/{idCompra}:
    get:
      tags:
      - Ticket
      summary: Consultar compra y sus entradas
      parameters:
      - name: idCompra
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 50
      responses:
        '200':
          description: Operacion correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
        '404':
          description: Recurso no encontrado
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - CLIENTE
      - ADMINISTRADOR
  /ticket/compras/{idCompra}/reintentar:
    post:
      tags:
      - Ticket
      summary: Reintentar confirmacion de compra sin volver a cobrar
      description: Se usa solo cuando la compra quedo pendiente
      parameters:
      - name: idCompra
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 50
      responses:
        '200':
          description: Operacion correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
        '400':
          description: Datos invalidos o solicitud incorrecta
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '409':
          description: Operacion rechazada por el estado o por conflicto
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '202':
          description: Confirmacion sigue pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - CLIENTE
      - ADMINISTRADOR
  /ticket/{id}:
    get:
      tags:
      - Ticket
      summary: Consultar ticket por ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 100
      responses:
        '200':
          description: Operacion correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Recurso no encontrado
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - CLIENTE
      - ADMINISTRADOR
  /ticket/{id}/solicitar-devolucion:
    post:
      tags:
      - Ticket
      summary: Solicitar devolucion hasta 72 horas antes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 100
      - name: idCliente
        in: query
        required: true
        schema:
          type: string
        example: cliente-01
      responses:
        '200':
          description: Operacion correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Datos invalidos o solicitud incorrecta
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - CLIENTE
      - ADMINISTRADOR
  /ticket/{id}/revisar-devolucion:
    patch:
      tags:
      - Ticket
      summary: Aprobar o rechazar una devolucion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 100
      - name: idAdministrador
        in: query
        required: true
        schema:
          type: string
        example: admin-01
      - name: decision
        in: query
        required: true
        schema:
          type: string
        description: APROBAR o RECHAZAR
        example: APROBAR
      responses:
        '200':
          description: Operacion correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Operacion rechazada por el estado o por conflicto
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - ADMINISTRADOR
  /ticket/{id}/procesar-reintegro:
    patch:
      tags:
      - Ticket
      summary: Procesar reintegro con pago mock
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 100
      responses:
        '200':
          description: Operacion correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Operacion rechazada por el estado o por conflicto
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - ADMINISTRADOR
  /ticket/{id}/finalizar-devolucion:
    patch:
      tags:
      - Ticket
      summary: Liberar asiento o cupo y finalizar devolucion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 100
      responses:
        '200':
          description: Operacion correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Operacion rechazada por el estado o por conflicto
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - ADMINISTRADOR
  /ticket/eventos/{idEvento}/estado-cancelacion:
    get:
      tags:
      - Ticket
      summary: Consultar devoluciones y avisos de un evento cancelado
      parameters:
      - name: idEvento
        in: path
        required: true
        schema:
          type: string
        example: evento-01
      responses:
        '200':
          description: Operacion correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoCancelacion'
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - ADMINISTRADOR
  /ticket/avisos-cancelacion:
    get:
      tags:
      - Ticket
      summary: Consultar avisos registrados por cliente
      parameters:
      - name: idCliente
        in: query
        required: true
        schema:
          type: string
        example: cliente-01
      responses:
        '200':
          description: Operacion correcta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvisoCancelacion'
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - CLIENTE
      - ADMINISTRADOR
  /ticket/interno/eventos/{idEvento}/bloquear-ventas:
    post:
      tags:
      - Interno
      summary: Bloquear nuevas compras antes de cancelar
      parameters:
      - name: idEvento
        in: path
        required: true
        schema:
          type: string
        example: evento-01
      responses:
        '200':
          description: Operacion correcta
          content:
            text/plain:
              schema: &id001
                type: string
        '400':
          description: Datos invalidos o solicitud incorrecta
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
      x-internal: true
      description: Operacion interna entre microservicios no destinada al usuario final
  /ticket/interno/eventos/{idEvento}/procesar-cancelacion:
    post:
      tags:
      - Interno
      summary: Procesar reintegros y avisos tras cancelar
      parameters:
      - name: idEvento
        in: path
        required: true
        schema:
          type: string
        example: evento-01
      - name: idAdministrador
        in: query
        required: true
        schema:
          type: string
        example: admin-01
      responses:
        '200':
          description: Operacion correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoCancelacion'
        '400':
          description: Datos invalidos o solicitud incorrecta
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
        '409':
          description: Operacion rechazada por el estado o por conflicto
          content:
            text/plain:
              schema:
                type: string
              example: Operacion no permitida
      x-internal: true
      description: Operacion interna entre microservicios no destinada al usuario final
  /ticket/cola/{idEvento}/entrar:
    post:
      tags:
      - Fila virtual
      summary: Ingresar a la fila virtual
      description: Se usa en eventos de alta demanda. CLIENTE solo puede ingresar con su propio id
      parameters:
      - name: idEvento
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColaRequest'
      responses:
        '200':
          description: Estado dentro de la fila
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColaResponse'
        '400':
          description: Datos invalidos
        '409':
          description: No se pudo ingresar a la fila
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - CLIENTE
      - ADMINISTRADOR
  /ticket/cola/{idEvento}/posicion:
    get:
      tags:
      - Fila virtual
      summary: Consultar posicion en la fila virtual
      parameters:
      - name: idEvento
        in: path
        required: true
        schema:
          type: string
      - name: idCliente
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Posicion y estado del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColaResponse'
        '404':
          description: Cliente no encontrado en la fila
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - CLIENTE
      - ADMINISTRADOR
      description: CLIENTE solo puede consultar su propia posicion
  /ticket/escanearQrcode:
    post:
      tags:
      - Acceso
      summary: Validar ingreso mediante QR
      description: Operacion de control de acceso. Un QR valido queda marcado como utilizado
      parameters:
      - name: qrCode
        in: query
        required: true
        schema:
          type: string
      - name: idEvento
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Entrada validada
        '400':
          description: Debe indicar QR y evento
        '404':
          description: Ticket no encontrado
        '409':
          description: QR ya utilizado o no valido para el evento
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - PERSONAL_ACCESO
      - ADMINISTRADOR
  /ticket/reportes/eventos/{idEvento}:
    get:
      tags:
      - Reportes
      summary: Consultar reporte de un evento
      description: Muestra ventas devoluciones ocupacion y recaudacion por sector y total. Solo el organizador correspondiente
        puede consultar el reporte
      parameters:
      - name: idEvento
        in: path
        required: true
        schema:
          type: string
      - name: idOrganizador
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Reporte generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteEvento'
        '404':
          description: Evento no encontrado
        '401':
          description: JWT faltante o invalido
        '403':
          description: Usuario autenticado pero sin permisos para esta operacion
      security:
      - bearerAuth: []
      x-roles:
      - ORGANIZADOR
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtenido mediante POST /clientes/login
  schemas:
    CompraNumeradaRequest:
      type: object
      properties:
        idCliente: *id001
        idEvento: *id001
        idSector: &id002
          type: integer
          format: int64
        idsAsientos:
          type: array
          items: *id002
        medioPago: *id001
        claveIdempotencia: *id001
      required:
      - idCliente
      - idEvento
      - idSector
      - idsAsientos
      - medioPago
      example:
        idCliente: cliente-01
        idEvento: evento-01
        idSector: 2
        idsAsientos:
        - 20
        medioPago: TARJETA
        claveIdempotencia: compra-numerada-001
      description: El precio no se envia en el request, claveIdempotencia es opcional pero debe repetirse igual al reintentar
    CompraGeneralRequest:
      type: object
      properties:
        idCliente: *id001
        idEvento: *id001
        idSector: *id002
        idReserva: *id002
        cantidad: &id005
          type: integer
          format: int32
        medioPago: *id001
        claveIdempotencia: *id001
      required:
      - idCliente
      - idEvento
      - idSector
      - idReserva
      - cantidad
      - medioPago
      example:
        idCliente: cliente-01
        idEvento: evento-01
        idSector: 3
        idReserva: 10
        cantidad: 2
        medioPago: TARJETA
        claveIdempotencia: compra-general-001
    Ticket:
      type: object
      properties:
        id: *id002
        idCompra:
          type: integer
          format: int64
          nullable: true
        idEvento: *id001
        idCliente: *id001
        idSector: *id002
        idAsiento:
          type: integer
          format: int64
          nullable: true
        idReservaGeneral:
          type: integer
          format: int64
          nullable: true
        precio: &id003
          type: number
          format: double
        qrCode: *id001
        usado:
          type: boolean
        estadoDevolucion: *id001
        idAdministradorRevision:
          type: string
          nullable: true
        fechaRevision:
          type: string
          format: date-time
          nullable: true
      example: &id004
        id: 100
        idCompra: 50
        idEvento: evento-01
        idCliente: cliente-01
        idSector: 2
        idAsiento: 20
        idReservaGeneral: null
        precio: 12000.0
        qrCode: TICKETYA-QR-EJEMPLO
        usado: false
        estadoDevolucion: SIN_SOLICITUD
        idAdministradorRevision: null
        fechaRevision: null
    CompraResponse:
      type: object
      properties:
        idCompra: *id002
        estado: *id001
        medioPago: *id001
        total: *id003
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
      example:
        idCompra: 50
        estado: CONFIRMADA
        medioPago: TARJETA
        total: 12000.0
        tickets:
        - *id004
    AvisoCancelacion:
      type: object
      properties:
        id: *id002
        idEvento: *id001
        idCliente: *id001
        mensaje: *id001
        fechaCreacion:
          type: string
          format: date-time
        fechaEntrega:
          type: string
          format: date-time
          nullable: true
      example:
        id: 1
        idEvento: evento-01
        idCliente: cliente-01
        mensaje: El evento fue cancelado
        fechaCreacion: '2026-11-10T19:00:00Z'
        fechaEntrega: '2026-11-10T19:00:05Z'
    EstadoCancelacion:
      type: object
      properties:
        idEvento: *id001
        totalTickets: *id005
        devueltos: *id005
        pendientes: *id005
        detallePendientes:
          type: array
          items:
            type: object
            properties:
              idTicket: *id002
              estado: *id001
        avisosRegistrados: *id005
        avisosEntregados: *id005
        errores:
          type: array
          items: *id001
      example:
        idEvento: evento-01
