server.port=8082
spring.application.name=microservicio-evento

spring.datasource.url=jdbc:postgresql://localhost:5435/ticketya_eventos
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

logging.level.org.springframework.web=INFO
logging.level.com.ticketya=DEBUG
spring.devtools.restart.enabled=true

# Cache de consultas publicas, 5 minutos
spring.data.redis.host=${TICKETYA_REDIS_HOST:localhost}
spring.data.redis.port=${TICKETYA_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=5m
spring.cache.redis.cache-null-values=false

# Punto 11: avisos de publicaciones y cambios pendientes
ticketya.notificaciones.intervalo-ms=10000

# Integracion 04 - JWT firmado y clave entre servicios (defaults solo para desarrollo)
ticketya.jwt.secret=${TICKETYA_JWT_SECRET:ticketya-dev-only-change-this-jwt-secret-2026}
ticketya.internal.key=${TICKETYA_INTERNAL_KEY:ticketya-dev-only-change-this-internal-key-2026}

# tiempos maximos para llamadas a otros microservicios
ticketya.http.connect-timeout-ms=${TICKETYA_HTTP_CONNECT_TIMEOUT_MS:2000}
ticketya.http.read-timeout-ms=${TICKETYA_HTTP_READ_TIMEOUT_MS:5000}

# GET: un reintento corto ante 502, 503, 504 o conexion interrumpida
ticketya.http.get-retries=${TICKETYA_HTTP_GET_RETRIES:1}
ticketya.http.retry-delay-ms=${TICKETYA_HTTP_RETRY_DELAY_MS:150}

# Circuit Breaker de lecturas GET: 3 fallos y 10 segundos abierto
ticketya.cb.fallos=${TICKETYA_CB_FALLOS:3}
ticketya.cb.pausa-ms=${TICKETYA_CB_PAUSA_MS:10000}

# Incluir el traceId en los mensajes de log
logging.pattern.level=%5p [trace=%X{traceId:-}]
