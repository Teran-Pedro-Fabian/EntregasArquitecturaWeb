
  version: '3.8'

  services:
    postgresql:
      image: postgres:latest
      container_name: postgres-lugar
      ports:
        - "5432:5432"
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=admin
        - POSTGRES_DB=ticketya_db
      volumes:
        - postgres_lugar_data:/var/lib/postgresql/data

    redis:
      image: redis:latest
      container_name: redis-lugar
      ports:
        - "6379:6379"

  volumes:
    postgres_lugar_data: