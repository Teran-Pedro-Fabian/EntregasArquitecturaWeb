server.port=8083
spring.application.name=microservicio-lugar

# Configuración PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketya_lugares
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

logging.level.org.springframework.web=INFO
logging.level.com.ticketya=DEBUG
spring.devtools.restart.enabled=true
# Punto 4: revisar reservas vencidas cada 30 segundos
ticketya.reservas.limpieza-ms=30000

# Integracion 04 - JWT firmado y clave entre servicios (defaults solo para desarrollo)
ticketya.jwt.secret=${TICKETYA_JWT_SECRET:ticketya-dev-only-change-this-jwt-secret-2026}
ticketya.internal.key=${TICKETYA_INTERNAL_KEY:ticketya-dev-only-change-this-internal-key-2026}

# Incluir el traceId en los mensajes de log
logging.pattern.level=%5p [trace=%X{traceId:-}]
